services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_agency
    ports:
      - "5432:5432"
    volumes:
      - ai_agency_pgdata:/var/lib/postgresql/data

volumes:
  ai_agency_pgdata:
